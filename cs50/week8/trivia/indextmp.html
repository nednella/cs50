<!DOCTYPE html>

<html lang="en">
    <head>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap" rel="stylesheet">
        <link href="styles.css" rel="stylesheet">
        <title>Trivia!</title>
        <script>
            // TODO: Add code to check answers to questions

            // run script once page is loaded
            document.addEventListener('DOMContentLoaded', function(){
                // for multiple choice question
                // if correct answer selected
                let correct = document.querySelector(.'correct');                   // returns the element that has the class "correct"
                correct.addEventListener('click', function(){                       // add event listener for button click
                    correct.style.backgroundColor = 'green';                            // set button colour to green
                    document.querySelector('#q1feedback').innerHTML = 'Correct!';       // display text in black <p> field
                });

                // if incorrect answer selected
                let incorrects = document.querySelectorAll('.incorrect');           // returns an array of elements that have class "incorrect"
                for (let i = 0; i < incorrects.length; i++) {                       // loop through array of elements
                    incorrects[i].addEventListener('click', function() {                // add event listener for button click
                        incorrects[i].style.backgroundColor = 'red';                    // set button colour to red
                        document.querySelector('#q2feedback').innerHTML = 'Incorrect';  // display text in black <p> field
                    });
                }

                // for free response question
                document.querySelector('#check').addEventListener('click', function(){
                    let input = document.querySelector('input');                    // returns element where user has entered response
                    if (input.value === "1") {                                      // if response is correct
                        input.style.backgroundColor = 'green';
                        document.querySelector('#q2feedback').innerHTML = "Correct!";
                    }
                    else {                                                          // else the response is incorrect
                        input.style.backgroundColor = 'red';
                        document.querySelector('#q2feedback').innerHTML = "Incorrect";
                    }
                });
            });
        </script>
    </head>
    <body>
        <div class="header">
            <h1>Trivia!</h1>
        </div>

        <div class="container">
            <div class="section">
                <h2>Part 1: Multiple Choice </h2>
                <hr>
                <h3>What is the average ratio of humans to ants on Earth?</h3>
                <!-- TODO: Add multiple choice question here -->
                <button class="incorrect">500k</button>
                <button class="incorrect">1.4m</button>
                <button class="correct">2.5m</button>
                <button class="incorrect">7.1m</button>

                <p id="q1feedback"></p>
            </div>

            <div class="section">
                <h2>Part 2: Free Response</h2>
                <hr>
                <h3>How many grooves can be found on a single standard LP vinyl record?</h3>
                <!-- TODO: Add free response question here -->
                <input autcomplete="off" type="text">
                <button id="check">Check Answer</button>

                <p id="q2feedback"></p>
            </div>
        </div>
        <script>

    </script>
    </body>
</html>
